<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#0a0a0a"/>
  <!-- Big alien head top -->
  <rect x="22" y="4" width="20" height="4" fill="#00ff41"/>
  <rect x="16" y="8" width="32" height="4" fill="#00ff41"/>
  <rect x="12" y="12" width="4" height="28" fill="#00ff41"/>
  <rect x="52" y="12" width="4" height="28" fill="#00ff41"/>
  <rect x="16" y="40" width="32" height="4" fill="#00ff41"/>
  <!-- Big almond eyes -->
  <rect x="16" y="18" width="14" height="4" fill="#00ff41" filter="url(#glow)"/>
  <rect x="34" y="18" width="14" height="4" fill="#00ff41" filter="url(#glow)"/>
  <rect x="18" y="22" width="10" height="4" fill="#00ff41" filter="url(#glow)"/>
  <rect x="36" y="22" width="10" height="4" fill="#00ff41" filter="url(#glow)"/>
  <!-- Pupil -->
  <rect x="24" y="20" width="4" height="4" fill="#0a0a0a"/>
  <rect x="40" y="20" width="4" height="4" fill="#0a0a0a"/>
  <rect x="24" y="20" width="2" height="2" fill="#ff00ff"/>
  <rect x="40" y="20" width="2" height="2" fill="#ff00ff"/>
  <!-- Small mouth -->
  <rect x="28" y="34" width="8" height="2" fill="#00ff41" opacity="0.6"/>
  <!-- DJ Headphones -->
  <rect x="6" y="14" width="6" height="16" fill="#ff00ff"/>
  <rect x="52" y="14" width="6" height="16" fill="#ff00ff"/>
  <rect x="8" y="10" width="48" height="4" fill="#ff00ff" opacity="0.3"/>
  <!-- Headphone detail -->
  <rect x="8" y="18" width="2" height="4" fill="#00ffff" opacity="0.6"/>
  <rect x="54" y="18" width="2" height="4" fill="#00ffff" opacity="0.6"/>
  <!-- Neck / body hint -->
  <rect x="26" y="44" width="12" height="4" fill="#00ff41" opacity="0.5"/>
  <!-- Turntable hint bottom -->
  <rect x="16" y="52" width="32" height="2" fill="#ff00ff" opacity="0.3"/>
  <rect x="30" y="50" width="4" height="6" fill="#ff00ff" opacity="0.4"/>
  <rect x="20" y="56" width="24" height="2" fill="#00ffff" opacity="0.2"/>
</svg>
