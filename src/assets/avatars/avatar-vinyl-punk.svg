<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#0a0a0a"/>
  <!-- Mohawk -->
  <rect x="26" y="2" width="4" height="4" fill="#ff00ff" filter="url(#glow)"/>
  <rect x="30" y="2" width="4" height="6" fill="#ff00ff" filter="url(#glow)"/>
  <rect x="34" y="2" width="4" height="4" fill="#ff00ff" filter="url(#glow)"/>
  <rect x="28" y="6" width="8" height="4" fill="#ff00ff" opacity="0.7"/>
  <!-- Head -->
  <rect x="18" y="10" width="28" height="4" fill="#00ff41"/>
  <rect x="14" y="14" width="4" height="24" fill="#00ff41"/>
  <rect x="46" y="14" width="4" height="24" fill="#00ff41"/>
  <rect x="18" y="38" width="28" height="4" fill="#00ff41"/>
  <!-- Cyber eye (left) -->
  <rect x="18" y="20" width="10" height="6" fill="#ff3333" filter="url(#glow)"/>
  <rect x="20" y="22" width="2" height="2" fill="#ffffff"/>
  <!-- Eye (right) - visor -->
  <rect x="36" y="20" width="10" height="6" fill="#ff3333" filter="url(#glow)"/>
  <rect x="42" y="22" width="2" height="2" fill="#ffffff"/>
  <!-- Visor bar -->
  <rect x="14" y="20" width="36" height="2" fill="#ff3333" opacity="0.3"/>
  <!-- Nose piercing -->
  <rect x="30" y="28" width="4" height="4" fill="#00ff41"/>
  <rect x="34" y="30" width="2" height="2" fill="#ffff00"/>
  <!-- Mouth - grin -->
  <rect x="22" y="34" width="20" height="2" fill="#00ff41"/>
  <rect x="22" y="34" width="2" height="2" fill="#ffff00"/>
  <rect x="40" y="34" width="2" height="2" fill="#ffff00"/>
  <!-- Vinyl record on chest -->
  <rect x="22" y="46" width="20" height="2" fill="#00ff41" opacity="0.5"/>
  <rect x="20" y="48" width="24" height="2" fill="#00ff41" opacity="0.3"/>
  <rect x="30" y="48" width="4" height="2" fill="#ff00ff" opacity="0.5"/>
  <!-- Studs on shoulders -->
  <rect x="10" y="40" width="4" height="4" fill="#ffff00" opacity="0.6"/>
  <rect x="50" y="40" width="4" height="4" fill="#ffff00" opacity="0.6"/>
</svg>
