<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#0a0a0a"/>
  <!-- Antenna -->
  <rect x="30" y="4" width="4" height="8" fill="#00ff41"/>
  <rect x="26" y="4" width="12" height="4" fill="#00ff41" filter="url(#glow)"/>
  <!-- Head box -->
  <rect x="12" y="12" width="40" height="4" fill="#00ff41"/>
  <rect x="12" y="12" width="4" height="32" fill="#00ff41"/>
  <rect x="48" y="12" width="4" height="32" fill="#00ff41"/>
  <rect x="12" y="40" width="40" height="4" fill="#00ff41"/>
  <!-- Eyes - scanline style -->
  <rect x="18" y="20" width="10" height="4" fill="#ff00ff" filter="url(#glow)"/>
  <rect x="36" y="20" width="10" height="4" fill="#ff00ff" filter="url(#glow)"/>
  <rect x="18" y="24" width="10" height="2" fill="#ff00ff" opacity="0.4"/>
  <rect x="36" y="24" width="10" height="2" fill="#ff00ff" opacity="0.4"/>
  <!-- Mouth grid -->
  <rect x="20" y="32" width="4" height="4" fill="#00ff41"/>
  <rect x="28" y="32" width="4" height="4" fill="#00ff41"/>
  <rect x="36" y="32" width="4" height="4" fill="#00ff41"/>
  <rect x="24" y="32" width="4" height="4" fill="#00ff41" opacity="0.4"/>
  <rect x="32" y="32" width="4" height="4" fill="#00ff41" opacity="0.4"/>
  <rect x="40" y="32" width="4" height="4" fill="#00ff41" opacity="0.4"/>
  <!-- Ear modules -->
  <rect x="6" y="18" width="6" height="12" fill="#00ff41" opacity="0.5"/>
  <rect x="52" y="18" width="6" height="12" fill="#00ff41" opacity="0.5"/>
  <!-- Neck -->
  <rect x="26" y="44" width="12" height="4" fill="#00ff41" opacity="0.6"/>
  <!-- Bottom circuit -->
  <rect x="18" y="50" width="28" height="2" fill="#00ff41" opacity="0.3"/>
  <rect x="22" y="54" width="20" height="2" fill="#00ff41" opacity="0.2"/>
</svg>
