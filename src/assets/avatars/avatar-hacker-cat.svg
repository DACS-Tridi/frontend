<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#0a0a0a"/>
  <!-- Ears -->
  <rect x="10" y="6" width="4" height="4" fill="#00ff41"/>
  <rect x="14" y="10" width="4" height="4" fill="#00ff41"/>
  <rect x="46" y="10" width="4" height="4" fill="#00ff41"/>
  <rect x="50" y="6" width="4" height="4" fill="#00ff41"/>
  <!-- Ear fill -->
  <rect x="14" y="6" width="4" height="4" fill="#ff00ff" opacity="0.5"/>
  <rect x="46" y="6" width="4" height="4" fill="#ff00ff" opacity="0.5"/>
  <!-- Head -->
  <rect x="14" y="14" width="36" height="4" fill="#00ff41"/>
  <rect x="10" y="18" width="4" height="20" fill="#00ff41"/>
  <rect x="50" y="18" width="4" height="20" fill="#00ff41"/>
  <rect x="14" y="38" width="36" height="4" fill="#00ff41"/>
  <!-- Eyes - hacker shades -->
  <rect x="16" y="22" width="12" height="6" fill="#00ffff" filter="url(#glow)"/>
  <rect x="36" y="22" width="12" height="6" fill="#00ffff" filter="url(#glow)"/>
  <rect x="28" y="24" width="8" height="2" fill="#00ff41" opacity="0.5"/>
  <!-- Nose -->
  <rect x="30" y="30" width="4" height="2" fill="#ff00ff"/>
  <!-- Mouth / smirk -->
  <rect x="24" y="34" width="16" height="2" fill="#00ff41"/>
  <rect x="22" y="32" width="2" height="2" fill="#00ff41"/>
  <!-- Whiskers -->
  <rect x="4" y="30" width="8" height="2" fill="#00ff41" opacity="0.4"/>
  <rect x="4" y="34" width="8" height="2" fill="#00ff41" opacity="0.3"/>
  <rect x="52" y="30" width="8" height="2" fill="#00ff41" opacity="0.4"/>
  <rect x="52" y="34" width="8" height="2" fill="#00ff41" opacity="0.3"/>
  <!-- Headphones -->
  <rect x="6" y="16" width="6" height="10" fill="#ff00ff" opacity="0.6"/>
  <rect x="52" y="16" width="6" height="10" fill="#ff00ff" opacity="0.6"/>
  <rect x="10" y="12" width="44" height="2" fill="#ff00ff" opacity="0.3"/>
  <!-- Matrix rain hint -->
  <rect x="20" y="46" width="2" height="6" fill="#00ff41" opacity="0.2"/>
  <rect x="30" y="44" width="2" height="8" fill="#00ff41" opacity="0.25"/>
  <rect x="42" y="46" width="2" height="6" fill="#00ff41" opacity="0.15"/>
</svg>
