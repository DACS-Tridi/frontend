<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#0a0a0a"/>
  <!-- Glitch lines top -->
  <rect x="0" y="6" width="64" height="2" fill="#ff00ff" opacity="0.15"/>
  <rect x="0" y="12" width="64" height="1" fill="#00ffff" opacity="0.1"/>
  <!-- Face outline - slightly distorted -->
  <rect x="16" y="10" width="30" height="4" fill="#00ff41"/>
  <rect x="14" y="14" width="4" height="28" fill="#00ff41"/>
  <rect x="48" y="14" width="4" height="28" fill="#00ff41"/>
  <rect x="18" y="42" width="28" height="4" fill="#00ff41"/>
  <!-- Glitch shift on right side -->
  <rect x="50" y="16" width="4" height="8" fill="#ff00ff" opacity="0.4"/>
  <!-- Left eye - normal -->
  <rect x="18" y="20" width="8" height="8" fill="#00ffff" filter="url(#glow)"/>
  <rect x="20" y="22" width="4" height="4" fill="#0a0a0a"/>
  <rect x="22" y="22" width="2" height="2" fill="#00ffff"/>
  <!-- Right eye - glitched/shifted -->
  <rect x="38" y="18" width="8" height="8" fill="#ff00ff" filter="url(#glow)"/>
  <rect x="36" y="22" width="8" height="8" fill="#00ffff" filter="url(#glow)" opacity="0.5"/>
  <rect x="40" y="20" width="4" height="4" fill="#0a0a0a"/>
  <!-- Nose -->
  <rect x="30" y="28" width="4" height="4" fill="#00ff41"/>
  <!-- Mouth - glitch bars -->
  <rect x="20" y="36" width="22" height="2" fill="#00ff41"/>
  <rect x="22" y="38" width="18" height="2" fill="#ff00ff" opacity="0.4"/>
  <!-- Scanlines -->
  <rect x="0" y="26" width="64" height="1" fill="#00ff41" opacity="0.08"/>
  <rect x="0" y="34" width="64" height="1" fill="#00ff41" opacity="0.08"/>
  <rect x="0" y="42" width="64" height="1" fill="#00ff41" opacity="0.08"/>
  <!-- Data stream bottom -->
  <rect x="8" y="50" width="4" height="2" fill="#00ff41" opacity="0.3"/>
  <rect x="16" y="50" width="8" height="2" fill="#ff00ff" opacity="0.2"/>
  <rect x="28" y="50" width="12" height="2" fill="#00ff41" opacity="0.25"/>
  <rect x="44" y="50" width="6" height="2" fill="#00ffff" opacity="0.2"/>
  <rect x="10" y="54" width="14" height="2" fill="#00ff41" opacity="0.15"/>
  <rect x="30" y="54" width="8" height="2" fill="#ff00ff" opacity="0.15"/>
  <rect x="42" y="54" width="10" height="2" fill="#00ffff" opacity="0.15"/>
</svg>
