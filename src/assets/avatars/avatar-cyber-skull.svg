<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#0a0a0a"/>
  <!-- Skull outline -->
  <rect x="18" y="10" width="28" height="4" fill="#00ff41" filter="url(#glow)"/>
  <rect x="14" y="14" width="4" height="4" fill="#00ff41"/>
  <rect x="46" y="14" width="4" height="4" fill="#00ff41"/>
  <rect x="14" y="18" width="4" height="16" fill="#00ff41"/>
  <rect x="46" y="18" width="4" height="16" fill="#00ff41"/>
  <!-- Eyes -->
  <rect x="20" y="20" width="8" height="8" fill="#00ff41" filter="url(#glow)"/>
  <rect x="36" y="20" width="8" height="8" fill="#00ff41" filter="url(#glow)"/>
  <rect x="22" y="22" width="4" height="4" fill="#0a0a0a"/>
  <rect x="38" y="22" width="4" height="4" fill="#0a0a0a"/>
  <!-- Nose -->
  <rect x="30" y="30" width="4" height="4" fill="#00ff41"/>
  <!-- Teeth -->
  <rect x="18" y="38" width="28" height="4" fill="#00ff41"/>
  <rect x="18" y="42" width="4" height="4" fill="#00ff41"/>
  <rect x="26" y="42" width="4" height="4" fill="#00ff41"/>
  <rect x="34" y="42" width="4" height="4" fill="#00ff41"/>
  <rect x="42" y="42" width="4" height="4" fill="#00ff41"/>
  <!-- Jaw -->
  <rect x="14" y="34" width="4" height="8" fill="#00ff41"/>
  <rect x="46" y="34" width="4" height="8" fill="#00ff41"/>
  <!-- Circuit lines bottom -->
  <rect x="8" y="52" width="48" height="2" fill="#00ff41" opacity="0.3"/>
  <rect x="12" y="56" width="40" height="2" fill="#00ff41" opacity="0.2"/>
  <rect x="30" y="46" width="4" height="8" fill="#00ff41" opacity="0.4"/>
</svg>
